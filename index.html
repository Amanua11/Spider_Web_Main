<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpiderWeb | Website Development for Local Businesses</title>
    <style>
        /* Spider-Man Inspired Ambient Palette */
        :root {
            --primary: #050505;       /* Pure Black */
            /* Dynamic Radial Background: Deep Black that softens into a dark crimson glow */
            --bg-gradient: radial-gradient(circle at center, #250609 0%, #050505 80%);
            --bg-card: rgba(20, 20, 22, 0.75); /* Translucent sleek card to let the red glow show through */
            --accent: #bb1e25;        /* Premium Dark Crimson Red */
            --accent-hover: #ff2a3a;
            --text-light: #f5f5f7;    /* Primary Text */
            --text-muted: #a1a1a6;    /* Secondary Text */
            --web-color: rgba(187, 30, 37, 0.35); /* High Visibility Crimson Web Lines */
            --border-red: rgba(187, 30, 37, 0.2);  /* Crimson borders */
            
            /* Unique Pricing Link Colors */
            --price-white: #ffffff;
            --price-white-hover: #e1e1e6;
        }

        /* Smooth Scrolling */
        html {
            scroll-behavior: smooth;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            color: var(--text-light);
            background: var(--bg-gradient);
            background-attachment: fixed; /* Keeps the red ambient glow centered while scrolling */
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- SCROLL ANIMATION INITIAL STATES --- */
        .reveal {
            opacity: 0;
            transform: translateY(40px) scale(0.96);
            transition: opacity 0.7s cubic-bezier(0.25, 1, 0.5, 1), 
                        transform 0.7s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Active State (When visible on screen) */
        .reveal.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Stagger delays for cards inside a grid layout */
        .reveal-delay-1 { transition-delay: 0.05s; }
        .reveal-delay-2 { transition-delay: 0.12s; }
        .reveal-delay-3 { transition-delay: 0.18s; }
        .reveal-delay-4 { transition-delay: 0.24s; }

        /* --- HIGH VISIBILITY RED CSS SPIDER WEBS --- */
        .web-corner-tl, .web-corner-br {
            position: absolute;
            width: 180px;
            height: 180px;
            pointer-events: none;
            z-index: 1;
        }

        /* Top Left Web */
        .web-corner-tl {
            top: 0;
            left: 0;
            background: 
                radial-gradient(circle at 0 0, transparent 25px, var(--web-color) 26px, transparent 28px, transparent 50px, var(--web-color) 51px, transparent 53px, transparent 75px, var(--web-color) 76px, transparent 78px, transparent 100px, var(--web-color) 101px, transparent 103px, transparent 130px, var(--web-color) 131px, transparent 133px),
                linear-gradient(to bottom right, transparent 49.5%, var(--web-color) 50%, transparent 50.5%),
                linear-gradient(20deg, transparent 49.5%, var(--web-color) 50%, transparent 50.5%),
                linear-gradient(70deg, transparent 49.5%, var(--web-color) 50%, transparent 50.5%);
        }

        /* Bottom Right Web */
        .web-corner-br {
            bottom: 0;
            right: 0;
            background: 
                radial-gradient(circle at 100% 100%, transparent 25px, var(--web-color) 26px, transparent 28px, transparent 50px, var(--web-color) 51px, transparent 53px, transparent 75px, var(--web-color) 76px, transparent 78px, transparent 100px, var(--web-color) 101px, transparent 103px, transparent 130px, var(--web-color) 131px, transparent 133px),
                linear-gradient(to top left, transparent 49.5%, var(--web-color) 50%, transparent 50.5%),
                linear-gradient(200deg, transparent 49.5%, var(--web-color) 50%, transparent 50.5%),
                linear-gradient(250deg, transparent 49.5%, var(--web-color) 50%, transparent 50.5%);
        }

        /* Header Navigation */
        header {
            background-color: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(10px); /* Premium frosty header */
            border-bottom: 1px solid var(--border-red);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Unified Brand Lockup Styling */
        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-light);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 1.5px;
        }

        .logo .brand-spider {
            color: var(--accent);
            text-transform: uppercase;
        }
        
        .logo .brand-web {
            color: var(--text-light);
            text-transform: uppercase;
        }

        /* The 1 and Only SVG Logo */
        .logo-svg {
            width: 42px;
            height: 42px;
            transition: transform 0.3s ease;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.8));
        }

        .logo:hover .logo-svg {
            transform: scale(1.08) rotate(3deg);
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            margin-left: 20px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        /* Hero Section */
        .hero {
            position: relative;
            max-width: 1200px;
            margin: 40px auto;
            padding: 140px 20px;
            text-align: center;
            background: var(--bg-card);
            backdrop-filter: blur(4px);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 1px solid var(--border-red);
            animation: heroEntrance 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes heroEntrance {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero h1 {
            font-size: 48px;
            color: var(--text-light);
            margin-bottom: 20px;
            line-height: 1.2;
            position: relative;
            z-index: 2;
        }

        .hero p {
            font-size: 18px;
            color: var(--text-muted);
            max-width: 700px;
            margin: 0 auto 30px auto;
            position: relative;
            z-index: 2;
        }

        /* CTA Buttons */
        .cta-button {
            display: inline-block;
            background-color: var(--accent);
            color: var(--text-light);
            padding: 12px 30px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
            border: none;
        }

        .cta-button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(187, 30, 37, 0.6);
        }

        /* Pricing Section */
        .pricing-section {
            position: relative;
            background: transparent;
            padding: 100px 20px;
            margin-top: 40px;
            border-top: 1px solid var(--border-red);
            border-bottom: 1px solid var(--border-red);
        }

        .section-title {
            text-align: center;
            font-size: 36px;
            margin-bottom: 15px;
            position: relative;
            z-index: 2;
        }

        .section-subtitle {
            text-align: center;
            color: var(--text-muted);
            max-width: 700px;
            margin: 0 auto 50px auto;
            font-size: 16px;
            position: relative;
            z-index: 2;
        }

        .pricing-container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            align-items: stretch; /* Stretches cards to be equal height */
            position: relative;
            z-index: 2;
        }

        .price-card {
            background: var(--bg-card);
            backdrop-filter: blur(4px);
            padding: 50px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            border-top: 5px solid var(--text-muted);
            border-left: 1px solid var(--border-red);
            border-right: 1px solid var(--border-red);
            border-bottom: 1px solid var(--border-red);
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Content top-aligned, links bottom-aligned */
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-top-color 0.3s ease, opacity 0.7s ease;
            position: relative;
            overflow: hidden;
        }

        .price-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 35px rgba(187, 30, 37, 0.25);
            border-top-color: var(--text-light);
        }

        .price-card.premium {
            border-top-color: var(--accent);
        }

        .price-card.premium:hover {
            border-top-color: var(--accent-hover);
        }

        .price-card h3 {
            font-size: 24px;
            margin-bottom: 25px;
            position: relative;
            z-index: 2;
        }

        /* Custom Unique Link Styling - Clean White */
        .price-inquiry-link {
            display: inline-block;
            font-family: 'Courier New', Courier, monospace;
            font-size: 22px;
            font-weight: bold;
            color: var(--price-white);
            text-decoration: none;
            letter-spacing: -0.5px;
            margin-top: 25px; /* Adds clear separation below feature rules */
            position: relative;
            z-index: 2;
            transition: color 0.3s ease, transform 0.3s ease, text-shadow 0.3s ease;
        }

        .price-inquiry-link:hover {
            color: var(--price-white-hover);
            transform: scale(1.03);
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
        }

        .features-list {
            list-style: none;
            text-align: left;
            position: relative;
            z-index: 2;
        }

        .features-list li {
            margin-bottom: 15px;
            color: var(--text-muted);
        }

        .features-list li::before {
            content: "✓ ";
            color: var(--accent);
            font-weight: bold;
            margin-right: 5px;
        }

        /* Services Grid Layout */
        .services-section {
            position: relative;
            max-width: 1200px;
            margin: 60px auto;
            padding: 80px 20px;
        }

        .services-pitch {
            background: rgba(187, 30, 37, 0.12);
            border-left: 4px solid var(--accent);
            padding: 20px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 50px;
            font-size: 16px;
            color: var(--text-light);
            border-top: 1px solid rgba(187, 30, 37, 0.15);
            border-right: 1px solid rgba(187, 30, 37, 0.15);
            border-bottom: 1px solid rgba(187, 30, 37, 0.15);
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            position: relative;
            z-index: 2;
        }

        /* Interactive Card for Clean Layout */
        .service-card {
            background: var(--bg-card);
            backdrop-filter: blur(4px);
            border: 1px solid var(--border-red);
            padding: 35px 30px;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            cursor: pointer;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .service-card h3 {
            font-size: 20px;
            color: var(--text-light);
            margin-bottom: 0px;
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: margin 0.3s ease, color 0.3s ease;
        }

        .service-card h3 span {
            color: var(--accent);
            font-weight: 700;
        }

        /* Hidden Description managed by Height, Opacity, and Transform */
        .service-card p {
            color: var(--text-muted);
            font-size: 15px;
            position: relative;
            z-index: 2;
            max-height: 0;
            opacity: 0;
            transform: translateY(10px);
            transition: max-height 0.4s ease, opacity 0.3s ease, transform 0.4s ease;
            overflow: hidden;
            margin-top: 0;
        }

        /* Hover Reveal Mechanics */
        .service-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(187, 30, 37, 0.25);
            border-color: rgba(187, 30, 37, 0.5);
            background: rgba(35, 8, 10, 0.85); /* Dark crimson hue matching background */
        }

        .service-card:hover h3 {
            margin-bottom: 15px;
            color: #ffffff;
        }

        .service-card:hover p {
            max-height: 200px;
            opacity: 1;
            transform: translateY(0);
            margin-top: 5px;
        }

        /* Contact Section */
        .contact-section {
            position: relative;
            background: transparent;
            padding: 100px 20px;
            text-align: center;
            border-top: 1px solid var(--border-red);
        }

        .contact-section h2 {
            margin-bottom: 20px;
            position: relative;
            z-index: 2;
        }

            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
